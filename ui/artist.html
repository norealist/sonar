<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonar Player - Страница Артиста</title>
  
  <!-- Main Stylesheet for Artist View -->
  <link rel="stylesheet" href="artist.css">
</head>
<body>

  <!-- Top Utility Bar for Desktop Toolbar Controls -->
  <header class="desktop-toolbar">
    <div class="brand">
      <span class="material-symbols-rounded logo-icon">mic</span>
      <span class="brand-name">SONAR ARTIST PANEL</span>
    </div>
    
    <div class="view-controls">
      <!-- Artist Selection Dropdown -->
      <div class="device-select-wrapper">
        <span class="material-symbols-rounded select-icon">person</span>
        <select id="artistSelector" class="device-select" aria-label="Выбор артиста">
          <option value="PAXNKOXD">PAXNKOXD</option>
          <option value="1nonly">1nonly</option>
        </select>
      </div>

      <!-- Device Selector Dropdown -->
      <div class="device-select-wrapper">
        <span class="material-symbols-rounded select-icon">devices</span>
        <select id="deviceSelector" class="device-select" aria-label="Выбор устройства">
          <option value="phone">Android Phone (360×800)</option>
          <option value="ipad-pro">iPad Pro 11" (1194×834)</option>
          <option value="ipad-mini">iPad Mini (1024×768)</option>
          <option value="android-tablet">Android Tablet (1280×800)</option>
        </select>
      </div>

      <!-- Orientation Toggle Button -->
      <button id="toggleOrientationBtn" class="tool-btn" title="Переключить ориентацию (Портрет / Альбом)">
        <span class="material-symbols-rounded" id="orientIcon">screen_rotation</span>
        <span id="orientText">Портрет 📱</span>
      </button>

      <!-- Window Switcher Buttons -->
      <a href="main.html" class="tool-btn view-switch-btn" title="Перейти на главный экран">
        <span class="material-symbols-rounded">home</span>
        <span>Главный Экран 🏠</span>
      </a>

      <a href="index.html" class="tool-btn view-switch-btn" title="Перейти в музыкальный плеер">
        <span class="material-symbols-rounded">music_note</span>
        <span>Экран Плеера 🎵</span>
      </a>
    </div>
  </header>

  <!-- Main Viewport Workspace -->
  <main class="app-viewport">
    
    <!-- Gadget Phone / Tablet Frame Wrapper -->
    <div class="phone-frame device-phone portrait-frame" id="phoneFrame">
      
      <!-- Gadget Screen Content Area -->
      <div class="phone-screen portrait" id="phoneScreen">
        
        <!-- System Android Status Bar -->
        <div class="android-status-bar">
          <span class="time-text" id="clockDisplay">12:00</span>
          <div class="status-icons">
            <span class="material-symbols-rounded status-icon">wifi</span>
            <span class="material-symbols-rounded status-icon">signal_cellular_alt</span>
            <span class="material-symbols-rounded status-icon">battery_full</span>
          </div>
        </div>

        <!-- Scrollable Artist Screen Content (Matching main-artist-screen.png & Tablet Landscape) -->
        <div class="artist-screen-container">

          <!-- Left Column Group: Hero Artist Cover & Stats Pill Bar -->
          <div class="artist-hero-section">
            <div class="artist-hero-card">
              <img id="artistHeroImg" src="artists/PAXNKOXD.jpg" alt="PAXNKOXD" class="artist-hero-img">
              <div class="artist-hero-overlay">
                <h1 class="artist-hero-name" id="artistHeroName">PAXNKOXD</h1>
              </div>
            </div>

            <div class="artist-stats-pill">
              <div class="stat-item">
                <span class="stat-value" id="artistStatFans">67</span>
                <span class="material-symbols-rounded stat-icon">person</span>
              </div>
              <div class="stat-item">
                <span class="stat-value" id="artistStatAlbums">33</span>
                <span class="material-symbols-rounded stat-icon">album</span>
              </div>
              <a id="deezerLink" href="https://www.deezer.com" target="_blank" class="deezer-pill-btn" title="Deezer">
                <img src="deezer-logo.png" alt="Deezer" class="deezer-logo-icon">
              </a>
            </div>
          </div>

          <!-- Right Column Group: Section Header & Tracks Grid/List -->
          <div class="artist-tracks-section">
            <div class="singles-section-header">
              <span class="singles-section-title">ТРЕКИ НА УСТРОЙСТВЕ</span>
              <div class="view-mode-toggle">
                <button class="view-mode-btn active" id="toggleGridViewBtn" title="Вид: Плитки">
                  <span class="material-symbols-rounded">grid_view</span>
                </button>
                <button class="view-mode-btn" id="toggleListViewBtn" title="Вид: Список">
                  <span class="material-symbols-rounded">format_list_bulleted</span>
                </button>
              </div>
            </div>

            <div class="singles-grid-container view-grid" id="singlesGridContainer">
              <!-- Dynamically populated tiles or list rows -->
            </div>
          </div>

        </div> <!-- End artist-screen-container -->

        <!-- System Android Navigation Panel -->
        <div class="android-navigation-panel">
          <div class="nav-content-buttons">
            <button class="nav-sys-btn" title="Назад">
              <span class="material-symbols-rounded nav-icon">chevron_left</span>
            </button>
            <button class="nav-sys-btn" title="Домой">
              <span class="material-symbols-rounded nav-icon">circle</span>
            </button>
            <button class="nav-sys-btn" title="Недавние">
              <span class="material-symbols-rounded nav-icon">crop_square</span>
            </button>
          </div>
        </div>

      </div> <!-- End phone-screen -->
    </div> <!-- End phone-frame -->
  </main>

  <!-- Invisible Canvas for Dynamic Cover Color Extraction -->
  <canvas id="colorCanvas" style="display: none;"></canvas>

  <!-- Artist Screen Logic JS -->
  <script src="artist.js"></script>
</body>
</html>
